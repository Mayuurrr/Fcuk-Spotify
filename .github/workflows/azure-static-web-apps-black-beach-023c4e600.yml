- name: Build And Deploy
  id: builddeploy
  uses: Azure/static-web-apps-deploy@v1
  with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_BEACH_023C4E600 }}
    action: "upload"

    # Static Site Configuration
    app_location: "/"       # Your HTML/CSS/JS root folder
    output_location: "/"    # Same as app, since NO build output
    skip_app_build: true    # <-- Important for pure static sites

    github_id_token: ${{ steps.idtoken.outputs.result }}
